services:
  db:
    image: postgres:16-alpine
    container_name: inventory-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-inventory}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-inventory123}
      POSTGRES_DB: ${POSTGRES_DB:-inventory}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-inventory} -d ${POSTGRES_DB:-inventory}"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: inventory-migrate
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      DATABASE_URL: postgresql://${POSTGRES_USER:-inventory}:${POSTGRES_PASSWORD:-inventory123}@db:5432/${POSTGRES_DB:-inventory}?schema=public
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-adminpassword123}
      DEMO_USER_PASSWORD: ${DEMO_USER_PASSWORD:-demopassword123}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
    command: ["sh", "-c", "npx prisma db push --skip-generate && npx prisma db seed"]

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: inventory-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      TZ: Asia/Bangkok
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-inventory}:${POSTGRES_PASSWORD:-inventory123}@db:5432/${POSTGRES_DB:-inventory}?schema=public
      JWT_SECRET: ${JWT_SECRET:-local-dev-secret-key-32-chars-long!}
    ports:
      - "3000:3000"

volumes:
  postgres_data:
